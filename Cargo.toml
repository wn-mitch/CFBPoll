[workspace]
resolver = "2"
members = ["crates/cfbd", "crates/model", "crates/cli"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
libm = "=0.2.16"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
ureq = "=3.5.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Model tests replay full seasons.
[profile.test]
opt-level = 3
